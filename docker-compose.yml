version: "3.8"

services:
    frontend:
        build:
            context: ./Frontend
            dockerfile: Dockerfile
        container_name: hurigana-frontend
        ports:
            - "80:80" # 호스트의 80번 포트를 컨테이너의 80번 포트에 매핑
        depends_on:
          backend:
            condition: service_healthy

    backend:
        build:
            context: ./Backend
            dockerfile: Dockerfile
        container_name: hurigana-backend
        ports:
            - "8000:8000"
        volumes:
            - ./Backend:/app
        command: bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
        depends_on:
            - db
        environment:
            DATABASE_URL: postgresql://user:password@db:5432/huriganadb
            GEMINI_API_KEY: ${GEMINI_API_KEY}
            SECRET_KEY: ${SECRET_KEY}
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 20s

    db:
        image: postgres:13-alpine
        container_name: hurigana-db
        environment:
            POSTGRES_DB: huriganadb
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
        volumes:
            - db_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

volumes:
    db_data:
